name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  SOURCE_DATE_EPOCH: "946684800"
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.0
      - name: Require a reviewed main commit and matching tag
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          expected="v$(python -c 'from chaski_version import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "$expected"
      - run: uv run --frozen pytest -q -p no:cacheprovider
      - run: uv run --frozen ruff check .
      - run: uv build --out-dir dist
      - run: python scripts/smoke_wheel.py dist/chaski-*.whl
      - name: Checksum the artifacts
        run: |
          cd dist
          sha256sum chaski-*.whl chaski-*.tar.gz > checksums.txt
      - name: Publish the verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --repo "$GITHUB_REPOSITORY" --title "chaski $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md dist/chaski-*.whl dist/chaski-*.tar.gz dist/checksums.txt
