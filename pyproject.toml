[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chaski"
dynamic = ["version"]
description = "Post-commit and time-driven reactions for Quipu knowledge graphs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Steve Brown"}]
dependencies = ["PyYAML>=6.0.3,<7"]

[project.urls]
Repository = "https://github.com/scbrown/chaski"
Issues = "https://github.com/scbrown/chaski/issues"

[project.scripts]
chaski = "chaski:main"

[tool.setuptools]
py-modules = ["chaski", "chaski_version", "chaski_verify", "emitter", "graph_sink", "incremental", "alertmanager_sink", "command_sink", "external_event"]

[tool.setuptools.dynamic]
version = {attr = "chaski_version.__version__"}

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
