name: Publish documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install checksummed mdBook
        env:
          MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
        run: |
          set -euo pipefail
          asset=mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/$asset"
          echo "$MDBOOK_SHA256  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir "$RUNNER_TEMP/mdbook"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - run: mdbook build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: book
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
