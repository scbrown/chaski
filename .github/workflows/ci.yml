name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install . pytest==9.1.1
      # A run that collects nothing must not pass: -p no:cacheprovider keeps
      # it hermetic, and the count check fails an empty suite.
      - run: python -m pytest -q -p no:cacheprovider
      - run: test "$(python -m pytest -q --collect-only -p no:cacheprovider | grep -c '::')" -gt 0

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.10
      - run: ruff check .

  wheel:
    name: Installed wheel proof
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "946684800"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - run: python -m pip install uv==0.12.0
      - run: uv build --wheel --out-dir dist
      - run: python scripts/smoke_wheel.py dist/chaski-*.whl
